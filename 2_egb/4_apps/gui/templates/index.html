<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control POS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; padding: 10px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        /* MONITOREO */
        .monitor-panel { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            margin-bottom: 20px; 
            background: #e9ecef; 
            padding: 20px; 
            border-radius: 8px; 
        }
        .monitor-box { background: white; padding: 15px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .monitor-label { font-size: 0.9em; color: black; font-weight: bold; display: block; margin-bottom: 5px;}
        .monitor-value { font-size: 0.9em; color: black; }

        /* CONTROLES INDIVIDUALES */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 10px; }
        
        button { background: #007BFF; color: white; border: none; padding: 10px; cursor: pointer; width: 50%; border-radius: 10px; margin-top: 5px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        input, select { padding: 5px; width: 60%; margin-bottom: 10px; border-radius: 10px; border: 1px solid #ccc; text-align: center; }
        
        /* BOTÓN ENVIAR TODO */
        .full-width-control { margin-bottom: 30px; }
        .btn-all { 
            background: #007BFF;
            font-size: 1.2em; 
            font-weight: bold; 
            padding: 15px; 
            width: 100%;
            border-radius: 10px;
        }
        .btn-all:hover { background: #0056b3; }

        #status { margin-top: 10px; color: gray; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>Control de Posición de Motor DC</h1>

    <div class="monitor-panel">
        <div class="monitor-box">
            <span class="monitor-label">Tipo de Señal</span>
            <span class="monitor-value" id="read_tip">--</span>
        </div>
        <div class="monitor-box">
            <span class="monitor-label">Pendiente</span>
            <span class="monitor-value" id="read_pen">--</span>
        </div>
        <div class="monitor-box">
            <span class="monitor-label">PWM</span>
            <span class="monitor-value" id="read_pwm">--</span>
        </div>
        <div class="monitor-box">
            <span class="monitor-label">Set Point</span>
            <span class="monitor-value" id="read_spo">--</span>
        </div>
        <div class="monitor-box">
            <span class="monitor-label">Ángulo Actual</span>
            <span class="monitor-value" id="read_ang">--</span>
        </div>
        <div class="monitor-box">
            <span class="monitor-label">Error</span>
            <span class="monitor-value" id="read_err">--</span>
        </div>
    </div>

    <div class="controls">
        <div class="card">
            <h3>Setpoint</h3>
            <input type="number" id="val_spo" min="0" max="360" step="1" placeholder="Grados (0-360)">
            <button onclick="enviar('spo', 'val_spo')">Enviar Set Point</button>
        </div>

        <div class="card">
            <h3>Tipo de Entrada</h3>
            <select id="val_tip" onchange="verificarPendiente()">
                <option value="0">Escalón</option>
                <option value="1">Rampa</option>
            </select>
            <button onclick="enviar('tip', 'val_tip')">Enviar Tipo de Entrada</button>
        </div>

        <div class="card" id="card_pen">
            <h3>Pendiente</h3>
            <input type="number" id="val_pen" min="1" max="100" step="1" placeholder="Pendiente (1-100)">
            <button id="btn_pen" onclick="enviar('pen', 'val_pen')">Enviar Pendiente</button>
        </div>

        <div class="card">
            <h3>Banda de Error</h3>
            <input type="number" id="val_bde" min="0.1" max="20" step="0.1" placeholder="Banda de Error LEDs">
            <button onclick="enviar('bde', 'val_bde')">Enviar Banda</button>
        </div>
    </div>

    <div class="full-width-control">
        <button class="btn-all" onclick="enviarTodo()">Enviar Configuración Completa</button>
    </div>

    <p id="status">Esperando conexión...</p>
    <canvas id="errorChart"></canvas>
</div>

<script>
    const ctx = document.getElementById('errorChart').getContext('2d');
    const maxDataPoints = 50;
    
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: Array(maxDataPoints).fill(''),
            datasets: [{
                label: 'Error de Posición',
                data: Array(maxDataPoints).fill(0),
                borderColor: 'rgb(255, 99, 132)',
                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                borderWidth: 2,
                tension: 0.1,
                fill: true
            }]
        },
        options: {
            animation: false,
            scales: { y: { beginAtZero: true, suggestedMin: -10, suggestedMax: 10 } }
        }
    });

    function verificarPendiente() {
        const tipo = document.getElementById('val_tip').value;
        const inputPen = document.getElementById('val_pen');
        const btnPen = document.getElementById('btn_pen');
        const cardPen = document.getElementById('card_pen');

        if (tipo === "0") {
            inputPen.disabled = true;
            btnPen.disabled = true;
            cardPen.style.opacity = "0.5";
            // No borramos el valor para que 'enviarTodo' pueda leerlo si es necesario, 
            // aunque en modo escalón la pendiente no se usa.
        } else {
            inputPen.disabled = false;
            btnPen.disabled = false;
            cardPen.style.opacity = "1";
        }
    }

    // Validación auxiliar para no repetir código
    function validarValor(id) {
        const el = document.getElementById(id);
        const val = parseFloat(el.value);
        if (isNaN(val)) return { ok: false, msg: "Falta un valor" };
        if (el.min && val < parseFloat(el.min)) return { ok: false, msg: "Valor muy bajo en " + id };
        if (el.max && val > parseFloat(el.max)) return { ok: false, msg: "Valor muy alto en " + id };
        return { ok: true, val: val };
    }

    function enviarTodo() {
        // Validamos los 4 campos
        const v_spo = validarValor('val_spo');
        if (!v_spo.ok) { alert("Setpoint: " + v_spo.msg); return; }
        
        const v_bde = validarValor('val_bde');
        if (!v_bde.ok) { alert("Banda: " + v_bde.msg); return; }
        
        // Tipo siempre es válido (select)
        const v_tip = document.getElementById('val_tip').value; 
        
        // Pendiente solo validamos si es Rampa (1)
        let v_pen_val = 10; // Valor por defecto seguro
        if (v_tip === "1") {
            const v_pen = validarValor('val_pen');
            if (!v_pen.ok) { alert("Pendiente: " + v_pen.msg); return; }
            v_pen_val = v_pen.val;
        } else {
            // Si es escalón, leemos el valor si hay, sino mandamos uno por defecto para no romper el comando
            const temp = parseFloat(document.getElementById('val_pen').value);
            if (!isNaN(temp)) v_pen_val = temp;
        }

        const payload = {
            spo: v_spo.val,
            tip: v_tip,
            pen: v_pen_val,
            bde: v_bde.val
        };

        document.getElementById('status').innerText = "Enviando Todo...";
        
        fetch('/api/set_all', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('status').innerText = "Configuración Completa: " + data.device_response;
        });
    }

    function enviar(cmd, inputId) {
        // ... (Tu función enviar individual sigue igual) ...
        const inputElement = document.getElementById(inputId);
        let val = inputElement.value;
        if (inputElement.min && parseFloat(val) < parseFloat(inputElement.min)) { alert("Valor muy bajo"); return; }
        if (inputElement.max && parseFloat(val) > parseFloat(inputElement.max)) { alert("Valor muy alto"); return; }

        document.getElementById('status').innerText = "Enviando " + cmd + "...";
        fetch('/api/set', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cmd: cmd, val: val })
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('status').innerText = "Respuesta: " + data.device_response;
        });
    }

    setInterval(() => {
        fetch('/api/data')
        .then(response => response.json())
        .then(data => {
            document.getElementById('read_err').innerText = data.error.toFixed(2);
            document.getElementById('read_pwm').innerText = data.pwm.toFixed(0);
            document.getElementById('read_spo').innerText = data.spo.toFixed(1);
            document.getElementById('read_pen').innerText = data.pen.toFixed(1);
            document.getElementById('read_ang').innerText = data.ang.toFixed(2);
            document.getElementById('read_tip').innerText = (data.tip === 1) ? "Rampa" : "Escalón";

            const dataError = chart.data.datasets[0].data;
            dataError.shift();
            dataError.push(data.error);
            chart.update();
        });
    }, 250);

    window.onload = verificarPendiente;

</script>
</body>
</html>
