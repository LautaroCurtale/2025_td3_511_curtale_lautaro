<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control POS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; padding: 10px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        /* MONITOREO */
        .monitor-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; background: #e9ecef; padding: 20px; border-radius: 8px; }
        .monitor-box { background: white; padding: 15px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .monitor-label { font-size: 0.9em; color: black; font-weight: bold; display: block; margin-bottom: 5px;}
        .monitor-value { font-size: 0.9em; color: black; }

        /* CONTROLES */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 10px; }
        button { background: #007BFF; color: white; border: none; padding: 10px; cursor: pointer; width: 50%; border-radius: 10px; margin-top: 5px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        input, select { padding: 5px; width: 60%; margin-bottom: 10px; border-radius: 10px; border: 1px solid #ccc; text-align: center; }
        
        /* BOTONES DE ACCIÓN */
        .action-row { display: flex; gap: 10px; margin-bottom: 30px; }
        .btn-all { flex: 3; background: #007BFF; font-size: 1.2em; font-weight: bold; padding: 15px; border-radius: 10px; width: auto; }
        .btn-power { flex: 1; background: #007BFF; font-size: 1.2em; font-weight: bold; padding: 15px; border-radius: 10px; width: auto; border: 2px solid #0056b3; }
        .btn-power:active { background: #004494; transform: translateY(2px); }

        /* GRÁFICOS */
        .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .chart-container { background: white; padding: 10px; border-radius: 10px; border: 1px solid #eee; position: relative; }

        #status { margin-top: 10px; color: gray; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>Control de Posición de Motor DC</h1>

    <div class="monitor-panel">
        <div class="monitor-box"><span class="monitor-label">Tipo de Señal</span><span class="monitor-value" id="read_tip">--</span></div>
        <div class="monitor-box"><span class="monitor-label">Pendiente [%]</span><span class="monitor-value" id="read_pen">--</span></div>
        <div class="monitor-box"><span class="monitor-label">PWM [%]</span><span class="monitor-value" id="read_pwm">--</span></div>
        <div class="monitor-box"><span class="monitor-label">Set Point [°]</span><span class="monitor-value" id="read_spo">--</span></div>
        <div class="monitor-box"><span class="monitor-label">Ángulo Actual [°]</span><span class="monitor-value" id="read_ang">--</span></div>
        <div class="monitor-box"><span class="monitor-label">Error [°]</span><span class="monitor-value" id="read_err">--</span></div>
    </div>

    <div class="controls">
        <div class="card">
            <h3>Setpoint</h3>
            <input type="number" id="val_spo" min="0" max="360" step="1" placeholder="Grados [°] (0-360)">
            <button onclick="enviar('spo', 'val_spo')">Enviar Set Point</button>
        </div>
        <div class="card">
            <h3>Tipo de Entrada</h3>
            <select id="val_tip" onchange="verificarPendiente()">
                <option value="0">Escalón</option>
                <option value="1">Rampa</option>
            </select>
            <button onclick="enviar('tip', 'val_tip')">Enviar Tipo de Entrada</button>
        </div>
        <div class="card" id="card_pen">
            <h3>Pendiente</h3>
            <input type="number" id="val_pen" min="1" max="100" step="1" placeholder="Pendiente [%] (1-100)">
            <button id="btn_pen" onclick="enviar('pen', 'val_pen')">Enviar Pendiente</button>
        </div>
        <div class="card">
            <h3>Banda de Error</h3>
            <input type="number" id="val_bde" min="1" max="20" step="1" placeholder="Banda de Error LEDs [°] (1-20)">
            <button onclick="enviar('bde', 'val_bde')">Enviar Banda</button>
        </div>
    </div>

    <div class="action-row">
        <button class="btn-all" onclick="enviarTodo()">Enviar Configuración Completa</button>
        <button class="btn-power" onclick="togglePWM()" id="btn_power">ON/OFF</button>
    </div>

    <p id="status">Esperando conexión...</p>
    
    <div class="charts-row">
        <div class="chart-container">
            <canvas id="errorChart"></canvas>
        </div>
        <div class="chart-container" style="display: flex; justify-content: center; align-items: center;">
            <canvas id="angleChart" style="max-height: 300px; max-width: 300px;"></canvas>
        </div>
    </div>
</div>

<script>
    const maxDataPoints = 50;

    // --- GRÁFICO 1: ERROR ---
    const ctxError = document.getElementById('errorChart').getContext('2d');
    const chartError = new Chart(ctxError, {
        type: 'line',
        data: {
            labels: Array(maxDataPoints).fill(''),
            datasets: [{
                label: 'Error de Posición',
                data: Array(maxDataPoints).fill(0),
                borderColor: 'rgb(255, 99, 132)',
                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                borderWidth: 2,
                tension: 0.1,
                fill: true
            }]
        },
        options: {
            animation: false,
            scales: { y: { beginAtZero: true, suggestedMin: -10, suggestedMax: 10 } }
        }
    });

// --- PLUGIN PERSONALIZADO: AGUJA Y ETIQUETAS ---
    const gaugeNeedle = {
        id: 'gaugeNeedle',
        afterDatasetDraw(chart, args, options) {
            const { ctx, config, data, chartArea: { top, bottom, left, right, width, height } } = chart;
            ctx.save();
            
            const dataset = data.datasets[0];
            const currentAngle = dataset.needleValue !== undefined ? dataset.needleValue : 0;

            const centerX = width / 2 + left;
            const centerY = height / 2 + top;
            const outerRadius = chart.getDatasetMeta(0).data[0].outerRadius;
            const angleRad = (currentAngle * Math.PI / 180) - (Math.PI / 2);

            // Dibujar aguja
            ctx.translate(centerX, centerY);
            ctx.rotate(angleRad);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(outerRadius - 10, 0); 
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'black'; // Color de la aguja
            ctx.stroke();
            ctx.restore();

            // Punto central
            ctx.beginPath();
            ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
            ctx.fillStyle = 'black';
            ctx.fill();

            // Etiquetas (360°/0°, 90°, 180°, 270°)
            ctx.font = 'bold 14px Arial';
            ctx.fillStyle = '#666';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const textRadius = outerRadius + 25;
            ctx.fillText('360°/0°', centerX, centerY - textRadius);
            ctx.fillText('90°', centerX + textRadius, centerY);
            ctx.fillText('180°', centerX, centerY + textRadius);
            ctx.fillText('270°', centerX - textRadius, centerY);
        }
    };

    // --- GRÁFICO 2: ÁNGULO (Anillo Estático) ---
    const ctxAngle = document.getElementById('angleChart').getContext('2d');
    const chartAngle = new Chart(ctxAngle, {
        type: 'doughnut',
        data: {
            datasets: [{
                data: [1], // Valor estático para dibujar un anillo completo
                backgroundColor: ['#e9ecef'], // Color del anillo (Gris claro fijo)
                borderWidth: 0,
                needleValue: 0 // Aquí guardaremos el ángulo real
            }]
        },
        options: {
            layout: { padding: 50 },
            circumference: 360,
            cutout: '80%', // Grosor del anillo
            animation: false,
            plugins: {
                legend: { display: false }, 
                tooltip: { enabled: false }
            }
        },
        plugins: [gaugeNeedle]
    });

    let pidActivo = false;

    function togglePWM() {
        pidActivo = !pidActivo;
        document.getElementById('status').innerText = "Enviando ena...";
        fetch('/api/toggle_pid', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ estado: pidActivo ? 1 : 0 })
        })
        .then(r => r.json())
        .then(data => {
            document.getElementById('status').innerText = "Respuesta: " + data.device_response;
        });
    }

    function verificarPendiente() {
        const tipo = document.getElementById('val_tip').value;
        const inputPen = document.getElementById('val_pen');
        const btnPen = document.getElementById('btn_pen');
        const cardPen = document.getElementById('card_pen');
        if (tipo === "0") {
            inputPen.disabled = true; btnPen.disabled = true; cardPen.style.opacity = "0.5";
        } else {
            inputPen.disabled = false; btnPen.disabled = false; cardPen.style.opacity = "1";
        }
    }

    function validarValor(id) {
        const el = document.getElementById(id);
        const val = parseFloat(el.value);
        if (isNaN(val)) return { ok: false, msg: "Falta un valor" };
        if (el.min && val < parseFloat(el.min)) return { ok: false, msg: "Valor muy bajo en " + id };
        if (el.max && val > parseFloat(el.max)) return { ok: false, msg: "Valor muy alto en " + id };
        return { ok: true, val: val };
    }

    function enviarTodo() {
        const v_spo = validarValor('val_spo'); if (!v_spo.ok) { alert("Setpoint: " + v_spo.msg); return; }
        const v_bde = validarValor('val_bde'); if (!v_bde.ok) { alert("Banda: " + v_bde.msg); return; }
        const v_tip = document.getElementById('val_tip').value; 
        let v_pen_val = 10; 
        if (v_tip === "1") {
            const v_pen = validarValor('val_pen'); if (!v_pen.ok) { alert("Pendiente: " + v_pen.msg); return; }
            v_pen_val = v_pen.val;
        } else { const temp = parseFloat(document.getElementById('val_pen').value); if (!isNaN(temp)) v_pen_val = temp; }

        const payload = { spo: v_spo.val, tip: v_tip, pen: v_pen_val, bde: v_bde.val };
        document.getElementById('status').innerText = "Enviando Todo...";
        fetch('/api/set_all', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(response => response.json()).then(data => { document.getElementById('status').innerText = "Configuración Completa: " + data.device_response; });
    }

    function enviar(cmd, inputId) {
        const inputElement = document.getElementById(inputId);
        let val = inputElement.value;
        if (inputElement.min && parseFloat(val) < parseFloat(inputElement.min)) { alert("Valor muy bajo"); return; }
        if (inputElement.max && parseFloat(val) > parseFloat(inputElement.max)) { alert("Valor muy alto"); return; }
        document.getElementById('status').innerText = "Enviando " + cmd + "...";
        fetch('/api/set', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cmd: cmd, val: val }) })
        .then(response => response.json()).then(data => { document.getElementById('status').innerText = "Respuesta: " + data.device_response; });
    }

    setInterval(() => {
        fetch('/api/data')
        .then(response => response.json())
        .then(data => {
            document.getElementById('read_err').innerText = data.error.toFixed(0);
            document.getElementById('read_pwm').innerText = data.pwm.toFixed(0);
            document.getElementById('read_spo').innerText = data.spo.toFixed(0);
            document.getElementById('read_pen').innerText = data.pen.toFixed(0);
            document.getElementById('read_ang').innerText = data.ang.toFixed(0);
            document.getElementById('read_tip').innerText = (data.tip === 1) ? "Rampa" : "Escalón";

            // Actualizar Gráfico de Error
            const dataError = chartError.data.datasets[0].data;
            dataError.shift();
            dataError.push(data.error);
            chartError.update();

            // Actualización Gráfico de Ángulo
            chartAngle.data.datasets[0].needleValue = data.ang; 
            chartAngle.update();
        });
    }, 250);

    window.onload = verificarPendiente;

</script>
</body>
</html>
